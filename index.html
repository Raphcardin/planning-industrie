<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning Industrie</title>
<meta name="theme-color" content="#121417">
<link rel="manifest" href="manifest.json">

<style>
/* VOICE: outil de chantier, direct, lisible en plein soleil avec des gants
   IDEA: le tableau de planning de l'atelier, mis dans la poche
   PICTURE: la grille « qui est où » elle-même, cases matin / après-midi, fusionnées quand la journée est identique
   COLOUR and TYPE: bandeau pétrole profond, panneaux blancs, accent cyan ; codes couleur métier ; Barlow Condensed + Barlow
   LAYOUT: une colonne mobile, en-tête fixe, onglets en bas selon le rôle */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6f5,#0c1417);--panel:light-dark(#fff,#15242a);--ink:light-dark(#10202a,#e8f0f2);--mute:light-dark(#56656c,#98aab1);
--line:light-dark(#dfe5e6,#24363d);--band:#121417;--accent:light-dark(#2563EB,#60A5FA);--red:#d63a2f;--today:light-dark(#e8effd,#172440);
--site:light-dark(#dcecef,#1d3c44);--siteInk:light-dark(#0f3d4a,#c6eef3)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--band);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px}
.top h1{font:700 24px/1 "Barlow Condensed",sans-serif;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .zm{display:none}
.top button{font-size:14px;background:rgba(255,255,255,.13);border:0;border-radius:99px;padding:8px 12px;color:#fff;min-height:40px}
main{max-width:640px;margin:0 auto;padding:14px 12px 110px}
main.nonav{padding-bottom:30px}
.demo{font-size:13px;color:var(--mute);margin:4px 2px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.h2{font:700 21px/1.1 "Barlow Condensed",sans-serif;margin:16px 2px 8px}
.ast{display:flex;align-items:center;gap:12px;background:#6d1426;color:#fff;border:0;padding:8px 10px}
.ast b{font:700 17px/1.1 "Barlow Condensed",sans-serif;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.astti{font:700 21px/1 "Barlow Condensed",Barlow,sans-serif;color:#fff}
.asth{display:flex;justify-content:space-between;align-items:center;gap:8px}.asth .edit{min-height:34px!important;padding:4px 12px!important;font-size:14px}
.astw{flex:1;display:flex;flex-direction:column;gap:4px}.astl{display:grid;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.07);border-left:4px solid transparent}
.astl.past{opacity:.5}.astl.mine{background:rgba(255,255,255,.2)}.astl.now{border-left-color:#fff}.astr{display:flex;justify-content:space-between;align-items:center;gap:8px}.astnow{display:inline;font:600 12px Barlow,sans-serif;white-space:nowrap}.astd{font:600 16px/1.15 "Barlow Condensed",Barlow,sans-serif;white-space:nowrap}.astt{font-size:11px;font-weight:700;background:#fff;color:#6d1426;border-radius:99px;padding:2px 8px;white-space:nowrap}
.ast .edit{background:#fff!important;color:#6d1426!important}
.ast small{opacity:.85;font-size:13px}
.ast .edit{margin-left:auto;background:var(--accent);border:0;border-radius:10px;color:#04252c;font-weight:600;padding:8px 12px;min-height:40px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:42px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--band);color:#fff}
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav button{width:48px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:22px}
.weeknav div{flex:1;text-align:center;font:700 22px/1.1 "Barlow Condensed",sans-serif}
.wkl{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;min-height:64px;padding:6px 8px;text-align:center;font:700 25px/1.1 "Barlow Condensed",sans-serif}
.wkl b{color:light-dark(#2563EB,#60A5FA)}.wkl small{display:block;font:500 12px Barlow,sans-serif;color:var(--mute)}
.weeknav small{display:block;font:500 13px Barlow,sans-serif;color:var(--mute)}
.row{display:grid;grid-template-columns:minmax(0,4.6em) minmax(0,1fr) minmax(0,1fr);align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.today{background:var(--today);border-radius:10px}
.row .span2{grid-column:2/4}
.name{font-weight:600}.name small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.hd{font-size:13px;color:var(--mute);font-weight:600}
.cell{border:0;background:none;padding:0;text-align:left;min-height:46px;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:4px;width:100%}
.cell:disabled{cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:9px 10px;font-weight:600;font-size:15px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.chip .g{font-size:11px;font-weight:700;opacity:.75}
.c-NUIT{background:#141414;color:#fff;box-shadow:inset 0 0 0 1px #3a3a3a}.c-FORM{background:#e8771a;color:#fff}.c-BUR{background:#2b6fd9;color:#fff}.c-DISPO{background:#2f9e55;color:#fff}
.c-CP,.c-RTT,.c-RECUP,.c-ABS{background:#f7c51e;color:#3d2e00}
.site{background:var(--site);color:var(--siteInk)}
.empty{background:none;box-shadow:inset 0 0 0 2px var(--red);color:var(--red)}
.calm{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--mute)}
.cell:not(:disabled) .chip::after{content:"✎";margin-left:auto;opacity:.55;font-size:13px}
.nt{font-size:13px;color:var(--mute);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.ferieRow{grid-column:2/4;background:repeating-linear-gradient(135deg,var(--today) 0 8px,transparent 8px 16px);border-radius:9px;padding:12px 10px;font-weight:600;color:var(--mute);text-align:center}
.warn{background:light-dark(#fdecea,#3a1714);color:var(--red);border:0;font-weight:600}
.ok{background:light-dark(#e7f6ec,#12301d);color:#2f9e55;border:0;font-weight:600}
.btn{display:block;width:100%;min-height:48px;border-radius:12px;border:0;background:var(--band);color:#fff;font-weight:600;font-size:16px;margin:4px 0 12px}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.duo{display:flex;gap:8px}.duo .btn{flex:1}
.duo2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}
.set.tset{grid-template-columns:1fr}.set.tset>div:last-child{justify-self:end}
.netbar{position:sticky;top:0;z-index:50;background:#e8771a;color:#fff;font-weight:600;font-size:14px;padding:8px 14px;text-align:center}.netbar[hidden]{display:none}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:12px}.vseg{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px;gap:2px}.vseg button{white-space:nowrap;min-height:38px;padding:0 11px;border:0;border-radius:99px;background:none;font-weight:700;font-size:15px;color:var(--ink)}.vseg button.on{background:var(--band);color:#fff}.vseg .fved{padding:0 9px;font-size:17px;color:var(--mute);margin-left:-4px}.vrow .lgb{min-height:44px;white-space:nowrap}@media(max-width:370px){.vseg button{padding:0 8px;font-size:14px}.vrow .lgb{padding:0 9px;font-size:14px}}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.pills button{flex:none;min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.pills button.on{background:var(--band);color:#fff;border-color:var(--band)}
.gridcard{padding:8px 6px}
.gl{border-collapse:collapse;width:100%;table-layout:fixed}
.gl tbody td{padding:5px 2px}
.gl tbody th{padding:5px 4px 5px 6px}
.gl tbody tr{border-top:2px solid light-dark(#c9d3d6,#2c434b)}
.gl tbody tr:nth-child(even) th,.gl tbody tr:nth-child(even) td{background:light-dark(#e8eef0,#0f1d24)}
.gl tbody td{padding:6px 2px}.gl tbody th{padding:6px 4px 6px 6px;font-size:14px}
.gl tbody tr.absrow{border-top:3px double var(--mute)}
.gl tbody tr.absrow th{color:var(--mute);font-weight:500}
.gl col.n{width:4.6em}
.gl thead th{font-size:12px;font-weight:600;color:var(--mute);text-align:center;padding:4px 0;border-radius:8px 8px 0 0;line-height:1.15}
.gl thead th b{display:block;font-size:15px;color:var(--ink)}
.gl thead th.fh b{text-decoration:line-through;color:var(--mute)}
.gl tbody th{text-align:left;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:2px}
.gl tbody th.me{color:var(--accent)}
.gl .today,.gl tbody tr:nth-child(even) td.today{background:var(--today)}
.gl thead .today b{color:var(--accent)}
.hf{display:block;position:relative;width:100%;height:27px;border:0;font-size:13px;font-weight:700;font-family:"Barlow Condensed",Barlow,sans-serif;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.hf.t{border-radius:7px 7px 2px 2px;margin-bottom:2px}.hf.b{border-radius:2px 2px 7px 7px}
.hf.j{height:56px;border-radius:7px;white-space:normal;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:normal;hyphens:none;font-size:15px}
.hf.empty{background:light-dark(#fff,#15242a)}
.hf.calm{background:none}
.hf.fer{display:flex;align-items:center;justify-content:center;height:56px;border-radius:7px;background:repeating-linear-gradient(135deg,var(--today) 0 6px,transparent 6px 12px);color:var(--mute);font-size:11px}
.hf.nd::before,.hf.rf::after,.hf.rfd::after,.dot{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#15313b;box-shadow:0 0 0 1.5px #fff}
.hf.rf::after,.dot.rf{background:#e8771a}.hf.rfd::after,.dot.rfd{background:#2f9e55}.hf.nd.rf::after,.hf.nd.rfd::after{right:14px}
.dot{position:static;display:inline-block;margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mute)}.legend b{color:var(--ink)}
.key{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.key .chip{width:auto;font-size:12px;padding:4px 8px}
.days{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.days button{flex:1 0 auto;min-width:54px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sl{padding:4px 0;font-size:15px}.sl .hd{display:inline-block;width:6.6em}
.snote{font-size:13px;color:var(--mute);margin:2px 0 0 6.6em}
.badtxt{color:var(--red)}
.cover .srow b{font:700 19px/1.1 "Barlow Condensed",sans-serif}
.srow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.good,.mid,.bad{font-weight:700;font-size:14px}.good{color:#2f9e55}.mid{color:#e8771a}.bad{color:var(--red)}
.cv{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);margin-top:10px}
.cvn{font-weight:600;font-size:14px;line-height:1.2}.cvn small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.cvd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.cvday{display:flex;flex-direction:column;gap:2px;text-align:center}.cvday small,.cvf{font-size:11px;color:var(--mute);font-weight:600}
.cvf{text-decoration:line-through;text-align:center}
.cvs{height:17px;border:0;border-radius:4px;padding:0}
.cvs.ok,.sq.ok{background:#2f9e55}.cvs.ack,.sq.ack{background:#7c8a94}.cvs.ack{position:relative}.cvs.ack::after{content:'✓';color:#fff;font-size:11px;font-weight:700;line-height:17px}
.ackc{background:light-dark(#eceff1,#22313a);border:0;font-weight:600;color:light-dark(#3d4a52,#cfd8dd)}.ackb{background:#5f6d77}.ackchip{background:#7c8a94;color:#fff;width:auto}.cvs.unk,.sq.unk{background:#e8771a}.cvs.gap,.sq.gap{background:var(--red)}
.sq{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:2px}
.alerts{background:light-dark(#fdecea,#3a1714);border-radius:10px;padding:10px;margin-top:10px}
.al{font-size:14px;font-weight:600;color:var(--red);padding:4px 0}.al small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.mini{min-height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px}
.cand{padding:7px 0;border-bottom:1px solid var(--line)}.cand .chip{width:auto;margin-left:6px;font-size:13px;padding:5px 8px}
.tit{display:block;font-size:11px;color:#e8771a;font-weight:600}
.fold summary{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600;cursor:pointer;min-height:28px;list-style:none}.fold summary::-webkit-details-marker{display:none}.fold summary>span:first-child::before{content:'▸ ';color:var(--mute)}.fold[open] summary>span:first-child::before{content:'▾ '}
.sec{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.sec>.hd{margin-bottom:2px}.sec .cv:first-of-type{border-top:0;margin-top:0}
.reqs{margin-top:10px}.reqs>b{font-size:14px}
.rqb{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;margin-top:6px;min-height:48px}
.rqb small{display:block;color:var(--mute);font-size:12px}.rqb.hot{border:2px solid #e8771a;background:light-dark(#fdf0e4,#3a2512);box-shadow:inset 5px 0 0 #e8771a;padding-left:14px}.rqb.hot b{font-size:16px;font-weight:800}.rqb.hot small{color:light-dark(#8a4a12,#e9b98a)}.st.go{flex-shrink:0;background:#e8771a;color:#fff;font-size:14px;padding:8px 14px}
.rq{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;margin-top:6px}
.rq .st{font-size:14px;padding:4px 10px}
.st{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.st.open{background:light-dark(#fdf0e4,#3a2512);color:#e8771a}.st.done{background:light-dark(#e7f6ec,#12301d);color:#2f9e55}.st.refused{background:var(--today);color:var(--mute)}
.reqcard{border-left:4px solid #e8771a}
.kpi{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}.kpi span{color:var(--mute);font-weight:600}
.kpi b{font:700 34px/1 "Barlow Condensed",sans-serif}
.scroll{overflow-x:auto}
.ht{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}
.ht th,.ht td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ht thead th{font-size:12px;color:var(--mute);font-weight:600}
.ht tbody th{text-align:left;font-weight:600}.ht thead th:first-child{text-align:left}
.ht tr:last-child th,.ht tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:99px;background:var(--today);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sub{padding:6px 0 0 12px;font-size:14px;display:flex;justify-content:space-between;color:var(--mute)}
.hist{padding:12px 4px;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist .t{font-size:13px;color:var(--mute)}
.hist .ch{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.hist .ch .chip{width:auto;font-size:13px;padding:5px 8px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}

nav svg{width:22px;height:22px}

label{font-weight:600;font-size:14px;display:block;margin:10px 0 6px}

<script>
{

  CP:{l:'CP',s:'CP',k:'abs'},RTT:{l:'RTT',s:'RTT',k:'abs'},RECUP:{l:'Récup',s:'Récup',k:'abs'},ABS:{l:'Absent',s:'Abs',k:'abs'}};

/* ---------- Dates ---------- */
const now=new Date();const g=(now.getDay()+6)%7;const TOFF=g>4?1:0,TDAY=g>4?0:g;

const isoMon=d=>{const m=new Date(d);m.setHours(12,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));return isoD(m)};
const offOf=k=>Math.round((new Date(k+'T12:00:00')-monday(0))/6048e5);
const dm=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const stamp=t=>{const d=new Date(t);return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}).replace(':','h')};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FC={};
function feries(y){if(FC[y])return FC[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g2=Math.floor((b-f+1)/3),h=(19*a+b-d-g2+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  const P=new Date(y,mo-1,da,12),add=n=>{const x=new Date(P);x.setDate(x.getDate()+n);return isoD(x)};
  const r={};[['01-01',"Jour de l'an"],['05-01','Fête du travail'],['05-08','8 mai 1945'],['07-14','Fête nationale'],['08-15','Assomption'],['11-01','Toussaint'],['11-11','Armistice'],['12-25','Noël']].forEach(([md,n])=>r[y+'-'+md]=n);
  r[add(1)]='Lundi de Pâques';r[add(39)]='Ascension';r[add(50)]='Lundi de Pentecôte';return FC[y]=r}
const ferie=(k,i)=>{const d=dayDate(k,i);return feries(d.getFullYear())[isoD(d)]||''};

/* ---------- Données partagées (Supabase) ---------- */
const SB_URL='https://rczqomfypjfocdaexlit.supabase.co',SB_KEY='sb_publishable_A7kzuAXBYttDYrr5LVf1IA_xJamsKAy';
const sb=window.__SB||(window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'planning-industrie-auth'}}):null);
const blankDB=()=>({data:{},notes:{},ast:{},hist:[],fav:{},alerts:[],reqs:[],ack:{},fsites:{},meet:{}});
let CONF=JSON.parse(JSON.stringify(DEFAULT_CONF)),DB=blankDB(),SNAP={},SNAPI={},SNAPV={},TEAM=[],LOADED=false,BUSY=false,PEND=false,NET=true,NETMSG='',BOOTED=false;
const canon=v=>v===undefined||v===null?'null':typeof v!=='object'?JSON.stringify(v):Array.isArray(v)?'['+v.map(canon).join(',')+']':'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
const hsh=x=>{let h=5381;for(let i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return (h>>>0).toString(36)};
function toItems(){
  const m={},put=(k,kind,owner,val)=>{m[k]={kind,owner:owner||null,val}};
  put('conf','conf',null,CONF);
  const nb={};Object.entries(DB.notes).forEach(([x,v])=>{if(!v)return;const p=x.split('|');(nb[p[0]+'|'+p[1]]=nb[p[0]+'|'+p[1]]||{})[p[2]]=v});
  const done=new Set();
  Object.entries(DB.data).forEach(([k,w])=>Object.entries(w).forEach(([t,sl])=>{const n=nb[k+'|'+t]||{};if(sl.some(Boolean)||Object.keys(n).length){put('w|'+k+'|'+t,'week',t,{s:sl,n});done.add(k+'|'+t)}}));
  Object.entries(nb).forEach(([kt,n])=>{if(!done.has(kt)){const p=kt.split('|');put('w|'+kt,'week',p[1],{s:Array(10).fill(''),n})}});
  Object.entries(DB.ast).forEach(([k,v])=>put('a|'+k,'ast',null,v));
  DB.hist.forEach(e=>put('h|'+e.at+'|'+hsh(canon(e)),'hist',null,e));
  Object.entries(DB.fav).forEach(([u,v])=>put('fav|'+u,'fav',u,v));
  Object.entries(DB.fsites).forEach(([u,v])=>put('fs|'+u,'fs',u,v));
  DB.alerts.forEach(a=>put('al|'+a.at+'|'+hsh(a.txt||''),'alert',null,a));
  DB.reqs.forEach(r=>put('r|'+r.id,'req',null,r));
  Object.entries(DB.ack).forEach(([x,v])=>put('ack|'+x,'ack',null,v));
  Object.entries(DB.meet).forEach(([x,v])=>put('m|'+x,'meet',x.split('|')[1],v));
  return m}
function fromItems(rows){
  const C=rows.find(r=>r.key==='conf');CONF=C?C.val:JSON.parse(JSON.stringify(DEFAULT_CONF));
  const D=blankDB();
  rows.forEach(r=>{const v=r.val;switch(r.kind){
    case 'week':{const p=r.key.split('|');(D.data[p[1]]=D.data[p[1]]||{})[p[2]]=(v.s||[]).concat(Array(10).fill('')).slice(0,10);Object.entries(v.n||{}).forEach(([sl,x])=>{D.notes[p[1]+'|'+p[2]+'|'+sl]=x});break}
    case 'ast':D.ast[r.key.slice(2)]=v;break;
    case 'hist':D.hist.push(v);break;
    case 'fav':D.fav[r.owner]=v;break;
    case 'fs':D.fsites[r.owner]=v;break;
    case 'alert':D.alerts.push(v);break;
    case 'req':D.reqs.push(v);break;
    case 'ack':D.ack[r.key.slice(4)]=v;break;
    case 'meet':D.meet[r.key.slice(2)]=v;break}});
  D.hist.sort((a,b)=>b.at-a.at);D.alerts.sort((a,b)=>b.at-a.at);D.reqs.sort((a,b)=>(b.at||0)-(a.at||0));
  DB=D}
const E10=()=>Array(10).fill('');
function mergeWeek(base,loc,srv){const b=base||{s:E10(),n:{}},l=loc||{s:E10(),n:{}},v=srv||{s:E10(),n:{}},s=[],n={};
  for(let i=0;i<10;i++){const ch=((l.s||[])[i]||'')!==((b.s||[])[i]||'')||((l.n||{})[i]||'')!==((b.n||{})[i]||'');const src=ch?l:v;s.push((src.s||[])[i]||'');const x=(src.n||{})[i];if(x)n[i]=x}
  return {s,n}}
function applyWeek(k,t,m){(DB.data[k]=DB.data[k]||{})[t]=m.s.slice();for(let i=0;i<10;i++){const id=k+'|'+t+'|'+i;if(m.n[i])DB.notes[id]=m.n[i];else delete DB.notes[id]}}
function canWrite(it){if(isAdmin())return true;const me=S.user&&S.user.n;return (['week','meet','fav','fs'].includes(it.kind)&&it.owner===me)||['req','alert','ack','hist'].includes(it.kind)}
async function fetchAll(){let out=[];for(let i=0;;i+=1000){const {data,error}=await sb.from('items').select('key,kind,owner,val').order('key').range(i,i+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break}return out}
function setNet(ok,msg){const was=NET;NET=ok;NETMSG=msg||'';const b=document.getElementById('netbar');if(b){b.hidden=ok;b.textContent=msg||''}if(ok!==was&&!ok)console.warn(msg)}
const sheetOpen=()=>!!document.querySelector('#sheet.open');
const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};

  if(!sb||!S.user||BUSY||PEND)return false;
  try{const rows=await fetchAll();if(BUSY||PEND)return false;
    fromItems(rows);SNAP={};SNAPI={};SNAPV={};rows.forEach(r=>{SNAP[r.key]=canon({kind:r.kind,owner:r.owner||null,val:r.val});SNAPI[r.key]={kind:r.kind,owner:r.owner||null};if(r.kind==='week')SNAPV[r.key]=JSON.parse(JSON.stringify(r.val))});

function recapRows(){
  const {lb,SI}=computeHours(),plain=lb.replace(/<[^>]+>/g,'');
  const rows=[],merges=[],R=(c,ht)=>{rows.push(c?{c,ht}:null);return rows.length};
  const flt=[S.fs?S.fs.replace('g:',''):'',S.ft?short(S.ft):''].filter(Boolean);
  R([['HEURES PAR SITE — '+plain.toUpperCase()+(flt.length?' — '+flt.join(' · ').toUpperCase():''),1]],24);merges.push('A1:C1');
  R([['Généré le '+new Date().toLocaleDateString('fr-FR')+' · matin 4 h, après-midi 3 h 45',9]]);merges.push('A2:C2');
  R(null);
  R([['Site / technicien',3],['Groupe',3],['Heures',3]],22);
  const blocks={};Object.entries(SI).forEach(([n,x])=>{const g=(siteOf(n)||{}).g||'';const k=g?'g:'+g:'s:'+n;const B=blocks[k]=blocks[k]||{g,tot:0,items:[]};B.tot+=x.tot;B.items.push([n,x])});
  const bl=Object.values(blocks).sort((a,b)=>b.tot-a.tot);let all=0;
  if(!bl.length)R([['Aucune heure sur site pour cette période',4]]);
  bl.forEach(B=>{all+=B.tot;
    B.items.sort((a,b)=>b[1].tot-a[1].tot).forEach(([n,x])=>{
      R([[n,7],[B.g||'',7],[x.tot,8]],18);
      Object.entries(x.by).sort((a,b)=>b[1]-a[1]).forEach(([tn,h])=>R([[short(tn),19],['',4],[h,5]]));R([],8)});
    if(B.g&&B.items.length>1){R([['Total '+B.g,20],['',20],[B.tot,21]],20);R([],14)}});
  if(bl.length){const r=R([['TOTAL SITES',3],['',3],[all,18]],20);merges.push('A'+r+':B'+r)}
  const sn=Object.keys(SI);
  const widths=[Math.max(24,...sn.map(n=>n.length+4)),Math.max(14,...bl.map(B=>B.g.length+2)),12];
  const per=S.per==='week'?'S'+isoWeek(monday(S.hoff)):plain.replace(/\s+/g,'_');
  return {rows,merges,widths,name:'Heures par site '+(S.per==='week'?per:plain),file:('Heures_par_site_'+per+(flt.length?'_'+flt.join('_'):'')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9_-]+/g,'_')+'.xlsx'};
}

function fitTags(){document.querySelectorAll('#sheet .tags').forEach(el=>{let f=16;el.style.fontSize=f+'px';while(el.scrollWidth>el.clientWidth+1&&f>10){f-=.5;el.style.fontSize=f+'px'}})}
function paintSheet(){fitTags();
  sheet.querySelectorAll('[data-act=scope]').forEach(x=>x.classList.toggle('on',+x.dataset.v===scope));
  const same=pend[0]===pend[1];
  const clr=h=>`<button type="button" class="pclr" data-act="pclr" data-v="${h}" aria-label="Vider">×</button>`;
  document.getElementById('pend').innerHTML=scope===2?`<div class="on full"><small>Journée</small>${same&&pend[0]?clr(2):''}${same?chip(pend[0],'Choisis ci-dessous'):'<span class="chip calm">Choisis ci-dessous</span>'}</div>`:
    [0,1].map(h=>`<div role="button" tabindex="0" class="${scope===h?'on':''}" data-act="scope" data-v="${h}"><small>${h?'Après-midi':'Matin'}</small>${pend[h]?clr(h):''}${chip(pend[h],'Choisis ci-dessous')}</div>`).join('');
  const curV=scope===2?(same?pend[0]:''):pend[scope];
  sheet.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.dataset.v===curV&&!!curV));
}
function pick(v){
  if(scope===2)pend=[v,v];else{pend[scope]=v;if(scope===0&&!pend[1]){scope=1}}
  paintSheet();
}
function saveDay(note){
  const {off,t,i}=cur,k=key(off),w=week(off);
  pend.forEach(v=>{if(v&&!CODES[v]&&!siteOf(v))CONF.sites.push({n:v})});
  closeSheet();let changed=0;
  const days=[i,...[...also].sort()];const broken=[];
  const m=watchGaps(()=>days.forEach(di=>[0,1].forEach(h=>{const s=di*2+h,val=pend[h],old=w[t][s],oldN=noteOf(k,t,s),nv=val?((scope===2||scope===h)?note:oldN):'';if(old===val&&oldN===nv)return;changed++;w[t][s]=val;setNote(k,t,s,nv);
    DB.reqs.forEach(r=>{if(r.status==='done'&&r.who===t&&r.wk===k&&r.slots.includes(s)&&val!==r.site&&!broken.includes(r)){broken.push(r)}});
    DB.hist.unshift({at:Date.now(),who:S.user.n,t,wk:k,s,from:old,to:val,note:oldN===nv?null:nv})})));
  broken.forEach(r=>{r.status='open';delete r.who;DB.alerts.unshift({at:Date.now(),txt:`${t} n'est plus en renfort à ${r.site} (${reqWhen(r)}, demandé par ${short(r.by)}) : renfort à nouveau à pourvoir`,seen:false})});
  if(!changed)return;save();render();toast((days.length>1?`Enregistré sur ${days.length} jours`:'Enregistré')+(broken.length?' · le renfort à '+broken[0].site+' repasse à pourvoir':'')+(m?' · Pierre et Raphaël prévenus : '+m:''));
}
function absSheet(){
  const t0=hasLine()?S.user.n:WORK()[0],d0=isoD(dayDate(key(S.off),0));
  const hs=id=>`<select id="${id}"><option value="0">Matin</option><option value="1">Après-midi</option></select>`;
  openSheet(`<h3>${isAdmin()?'Indiquer une absence':"Prévenir d'une absence"}</h3><div class="demo">Pour que l'équipe soit au courant. Ça ne remplace pas ta demande officielle de congé. Les week-ends et jours fériés sont sautés.</div><form id="cf">
  ${isAdmin()?`<label for="ct">Personne</label><select id="ct">${TECHS().map(t=>`<option ${t===t0?'selected':''}>${esc(t)}</option>`).join('')}</select>`:''}
  <label for="cc">Type</label><select id="cc">${[...ABSC,'FORM','NUIT'].map(c=>`<option value="${c}">${CODES[c].l}</option>`).join('')}</select>
  <label for="c1">Du</label><div class="duo2"><input type="date" id="c1" value="${d0}" required>${hs('h1')}</div>
  <label for="c2">Au</label><div class="duo2"><input type="date" id="c2" value="${d0}" required>${hs('h2')}</div>
  <button class="btn" style="margin-top:16px">${isAdmin()?'Enregistrer':'Prévenir'}</button></form>`);
  document.getElementById('h2').value='1';
  document.getElementById('cf').onsubmit=e=>{e.preventDefault();
    const t=isAdmin()?document.getElementById('ct').value:S.user.n,code=document.getElementById('cc').value;
    const a=new Date(document.getElementById('c1').value+'T12:00:00'),b=new Date(document.getElementById('c2').value+'T12:00:00');
    const ha=+document.getElementById('h1').value,hb=+document.getElementById('h2').value;
    if(isNaN(a)||isNaN(b)||b<a||(+a===+b&&hb<ha)){toast('Vérifie les dates');return}
    if((b-a)/864e5>120){toast('120 jours maximum à la fois');return}
    let n=0;const m=watchGaps(()=>{for(const d=new Date(a);d<=b;d.setDate(d.getDate()+1)){const i=(d.getDay()+6)%7;if(i>4)continue;
      const k=isoMon(d);if(ferie(k,i))continue;const w=week(k);
      [0,1].forEach(h=>{if(+d===+a&&h<ha)return;if(+d===+b&&h>hb)return;if(w[t][i*2+h]!==code){w[t][i*2+h]=code;n++}})}});
    const f=x=>x.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    if(n)DB.hist.unshift({at:Date.now(),who:S.user.n,t,kind:'abs',code,n,range:`${f(a)} ${ha?'après-midi':'matin'} → ${f(b)} ${hb?'après-midi':'midi'}`});
    save();closeSheet();render();toast(m?'Enregistré · Pierre et Raphaël prévenus : '+m:n?`${n} demi-journée${n>1?'s':''} en ${CODES[code].l}`:'Déjà posé')};
}

function meetList(){
  const k=key(S.off),d=dayDate(k,MEET.day),L=TECHS().map(t=>[t,meetOf(k,t)]);
  const g=st=>L.filter(x=>x[1].st===st);
  const sec=(tt,l,f)=>l.length?`<div class="hd lgh">${tt} (${l.length})</div>${l.map(([t,m])=>`<div class="lgi"><b style="min-width:6em">${esc(short(t))}</b><span>${f(m)}</span></div>`).join('')}`:'';
  const past=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)<new Date(),me=hasLine()&&!past?meetOf(k,S.user.n):null;
  openSheet(`<h3>${MEET.label} du jeudi ${dm(d)}, ${MEET.time}</h3>${past?'<div class="demo">Réunion passée</div>':''}
  ${me?(me.st==='exc'?`<div class="notebox">Toi : en ${esc(me.why)}</div>`:`<div class="card" style="margin:8px 0"><b>Toi : ${me.st==='yes'?'présent':'absent'}</b>
    <button class="btn ${me.st==='yes'?'':'ghost'}" style="margin-top:8px" data-act="meetyes">Je serai présent</button>
    <input id="mwhy" type="text" maxlength="40" placeholder="Motif si tu ne viens pas" value="${me.st==='no'?esc(me.why||''):''}">
    <button class="btn ${me.st==='no'?'danger':'ghost'}" style="margin:8px 0 0" data-act="meetno">${me.st==='no'?'Mettre à jour mon absence':'Je ne pourrai pas venir'}</button></div>`):''}
  ${sec('Absents',g('no'),m=>esc(m.why||'sans motif'))}${sec('En congé ou absence prévue',g('exc'),m=>esc(m.why))}${sec('Présents',g('yes'),()=>'')}
  <button class="btn ghost" style="margin-top:14px" data-act="close">Fermer</button>`);
}
function fsSheet(owner){
  const f=(DB.fsites||{})[owner]||[],groups=[...new Set(CONF.sites.map(x=>x.g).filter(Boolean))];
  const box=x=>`<label class="check"><input type="checkbox" value="${esc(x.n)}" ${f.includes(x.n)?'checked':''}>${esc(x.n)}</label>`;
  openSheet(`<h3>${owner===S.user.n?'Mes sites':'Sites de '+esc(owner)}</h3><div class="demo">Coche les sites les plus fréquents. Ils apparaîtront en premier quand tu remplis une case.</div><form id="fsf">
  ${CONF.sites.filter(x=>!x.g).sort((a,b)=>a.n.localeCompare(b.n)).map(box).join('')}
  ${groups.map(g=>`<div class="hd" style="margin-top:12px">${esc(g)}</div>${CONF.sites.filter(x=>x.g===g).sort((a,b)=>a.n.localeCompare(b.n)).map(box).join('')}`).join('')}
  <button class="btn" style="margin-top:16px">Enregistrer</button></form>`);
  document.getElementById('fsf').onsubmit=e=>{e.preventDefault();DB.fsites=DB.fsites||{};DB.fsites[owner]=[...sheet.querySelectorAll('input:checked')].map(x=>x.value);save();toast('Sites favoris enregistrés');if(lastCell)cellSheet(...lastCell);else closeSheet()};
}
function favSheet(){
  const f=favs();
  const first=!DB.fav[S.user.n];
  openSheet(`<h3>Qui afficher ?</h3><div class="hd" style="margin:6px 0 4px">Coche les personnes qui t'intéressent</div><div class="demo" style="margin-top:0">Elles deviennent tes favoris, visibles dans ★ Favoris. Tu peux te cocher toi-même.</div>
  <form id="fv">${TECHS().map(t=>`<label class="check"><input type="checkbox" value="${esc(t)}" ${f.includes(t)||(first&&t===S.user.n)?'checked':''}>${esc(t)}${t===S.user.n?' <span class="hd">(moi)</span>':''}</label>`).join('')}
  <button class="btn" style="margin-top:16px">Afficher ma sélection</button></form>`);
  document.getElementById('fv').onsubmit=e=>{e.preventDefault();DB.fav[S.user.n]=[...sheet.querySelectorAll('input:checked')].map(x=>x.value);S.flt=DB.fav[S.user.n].length?'fav':'all';save();closeSheet();render();toast('Favoris enregistrés')};
}
function astSheet(){
  const k=key(S.off),a=DB.ast[k]||['',''],o=astOf(k);
  const ax=AX(),opt=v=>`<option value="">—</option>`+WORK().map(t=>`<option ${t===v?'selected':''}>${esc(t)}</option>`).join('')+(ax.length?`<optgroup label="Astreinte seulement">${ax.map(t=>`<option ${t===v?'selected':''}>${esc(t)}</option>`).join('')}</optgroup>`:'');
  openSheet(`<h3>Astreinte</h3><div class="demo">Semaine du ${dm(monday(S.off))} · par défaut du jeudi ${dm(dayDate(k,3))} au jeudi ${dm(dayDate(k,10))}</div><form id="af"><label for="a1">Personne 1</label><select id="a1">${opt(a[0])}</select><label for="a2">Personne 2</label><select id="a2">${opt(a[1])}</select>
    <label class="chk" style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" id="afree" ${o.free?'checked':''} style="width:22px;height:22px"> Dates libres</label>
    <div id="afd" style="display:${o.free?'block':'none'}"><label for="af1">Du</label><input id="af1" type="date" value="${isoD(o.f)}"><label for="af2">Au</label><input id="af2" type="date" value="${isoD(o.t)}"></div>
    <button class="btn" style="margin-top:16px">Valider</button></form>`);
  document.getElementById('afree').onchange=e=>{document.getElementById('afd').style.display=e.target.checked?'block':'none'};
  document.getElementById('af').onsubmit=e=>{e.preventDefault();const txt=o=>o.n.join(' & ')+(o.free?' ('+dd(o.f)+' → '+dd(o.t)+')':''),old=txt(astOf(k)),n=[document.getElementById('a1').value,document.getElementById('a2').value];
    if(document.getElementById('afree').checked){const f1=document.getElementById('af1').value,f2=document.getElementById('af2').value;
      if(!f1||!f2||f2<f1){toast('Vérifie les dates');return}if((new Date(f2)-new Date(f1))/864e5>62){toast('Deux mois maximum');return}
      if(f1!==isoD(dayDate(k,3))||f2!==isoD(dayDate(k,10)))n.push({f:f1,t:f2})}
    DB.ast[k]=n;const nw=txt(astOf(k));if(old!==nw)DB.hist.unshift({at:Date.now(),who:S.user.n,wk:k,s:null,from:old,to:nw});save();closeSheet();render();toast('Astreinte mise à jour')};
}
function techSheet(i){
  const t=i==null?{n:'',short:'',r:'tech'}:CONF.techs[i];
  openSheet(`<h3>${i==null?'Ajouter une personne':'Modifier '+esc(t.n)}</h3><form id="tf">
  <label for="tn">Prénom</label><input id="tn" type="text" value="${esc(t.n)}" ${i==null?'':'readonly'} required>
  <label for="ts">Nom affiché quand la place manque</label><input id="ts" type="text" value="${esc(t.short)}" maxlength="9" placeholder="9 lettres max">
  <label for="tr">Accès</label><select id="tr"><option value="tech" ${t.r==='tech'?'selected':''}>Technicien (remplit sa semaine)</option><option value="admin" ${t.r==='admin'?'selected':''}>Accès complet</option></select>
  <label class="check"><input type="checkbox" id="ta" ${t.abs?'checked':''}>Ligne pour les absences seulement</label>
  <button class="btn" style="margin-top:16px">Enregistrer</button></form>`);
  document.getElementById('tf').onsubmit=e=>{e.preventDefault();const n=document.getElementById('tn').value.trim();if(!n)return;
    if(i==null&&TECHS().includes(n)){toast('Ce prénom existe déjà');return}
    const o={n,short:document.getElementById('ts').value.trim()||n.slice(0,9),r:document.getElementById('tr').value};if(document.getElementById('ta').checked)o.abs=true;
    if(i==null)CONF.techs.push(o);else CONF.techs[i]=o;save();closeSheet();render();toast('Enregistré')};
}
function reqSiteSheet(){
  sel='';
  openSheet(`<h3>Ajouter un site à couvrir</h3><label>Site</label>${sitePicker('','rsite')}
  <label>Titulaires</label><form id="qf">${WORK().map(t=>`<label class="check"><input type="checkbox" value="${esc(t)}">${esc(t)}</label>`).join('')}
  <button class="btn" style="margin-top:16px">Ajouter</button></form>`);
  document.getElementById('qf').onsubmit=e=>{e.preventDefault();if(!sel){toast('Choisis un site');return}if(CONF.req.some(r=>r.site===sel)){toast('Déjà dans la liste');return}
    CONF.req.push({site:sel,tit:[...sheet.querySelectorAll('input:checked')].map(x=>x.value)});save();closeSheet();render();toast('Site à couvrir ajouté')};
}


let XTXT='';
function exportSheet(title,txt){
  XTXT=txt;const rows=txt.trim().split('\n'),data=rows.filter(r=>r.trim());const lb=periodDays().label;
  const prev=rows.slice(0,6).map((r,i)=>`<tr>${r.split('\t').map(c=>i===0&&rows[0].startsWith('Date')?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
  openSheet(`<h3>${title}</h3><div class="demo">${esc(lb.replace(/<[^>]+>/g,''))}${S.ft?' · '+esc(S.ft):''}${S.fs?' · '+esc(S.fs.replace('g:','')):''} · ${data.length-1} ligne${data.length>2?'s':''}</div>
  <ol class="steps"><li>Appuie sur <b>Copier</b> ci-dessous.</li><li>Ouvre <b>Excel</b> ou <b>Google Sheets</b> sur une feuille vide.</li><li>Clique sur la case <b>A1</b> et fais <b>Coller</b> : chaque info tombe dans sa colonne.</li></ol>
  <button class="btn" data-act="xcopy">Copier</button><div id="xbox"></div>
  <label>Aperçu</label><div class="scroll card" style="padding:6px"><table class="xp">${prev}</table></div>
  <p class="demo">Dans la vraie version, ce sera directement un bouton « Télécharger le fichier Excel ».</p>`);
}
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
function copyOrShow(txt,boxId,msg){const box=document.getElementById(boxId);
  const fall=()=>{box.innerHTML='<label for="cpx">Sélectionne et copie ce texte</label><textarea id="cpx" rows="8" readonly></textarea>';const ta=document.getElementById('cpx');ta.value=txt;ta.focus();ta.select()};
  try{navigator.clipboard.writeText(txt).then(()=>toast(msg),fall)}catch(x){fall()}}

/* ---------- Actions ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
  if(!['tconf','sconf','rconf','wconf','dconf'].includes(a)&&S.tab==='reglages')S.confirm=null;
  switch(a){
  case 'pick':S.pick=+v;render();document.getElementById('pw').focus();break;
  case 'out':S.user=null;S.pick=null;LOADED=false;SNAP={};SNAPI={};DB=blankDB();try{sb&&sb.auth.signOut()}catch(x){}render();break;
  case 'retry':pull().then(()=>render());break;
  case 'tab':S.tab=v;S.confirm=null;render();try{scrollTo(0,0)}catch(x){}break;
  case 'wk':S.off+=+v;render();break;
  case 'day':S.day=+v;render();break;
  case 'by':S.by=v;render();break;
  case 'flt':S.flt=v;closeSheet();render();break;
  case 'per':S.per=v;render();break;
  case 'pnav':if(S.per==='week')S.hoff+=+v;else if(S.per==='month')S.moff+=+v;else S.yoff+=+v;render();break;
  case 'favs':favSheet();break;
  case 'legend':legendSheet();break;
  case 'meet':meetSheet();break;
  case 'meetlist':meetList();break;
  case 'meetyes':{const k=key(S.off);DB.meet=DB.meet||{};const had=DB.meet[k+'|'+S.user.n];delete DB.meet[k+'|'+S.user.n];if(had)DB.hist.unshift({at:Date.now(),who:S.user.n,t:S.user.n,wk:k,s:MEET.day*2,from:'Absent réunion',to:'Présent réunion',note:null});save();closeSheet();render();toast('Noté : présent à la réunion')}break;
  case 'meetno':{const k=key(S.off),why=document.getElementById('mwhy').value.trim();DB.meet=DB.meet||{};DB.meet[k+'|'+S.user.n]={why,at:Date.now()};DB.hist.unshift({at:Date.now(),who:S.user.n,t:S.user.n,wk:k,s:MEET.day*2,from:'Présent réunion',to:'Absent réunion',note:why||null});save();closeSheet();render();toast('Pierre et Raphaël verront ton absence à la réunion')}break;
  case 'dinfo':infoSheet(+b.dataset.t,+b.dataset.s,b.dataset.j==='1');break;
  case 'fsedit':fsSheet(v);break;
  case 'hd':S.hd=+v;render();break;
  case 'hlate':S.hlate=!S.hlate;render();break;
  case 'jump':jumpSheet();break;
  case 'jtoday':S.off=0;closeSheet();render();break;
  case 'cell':cellSheet(+b.dataset.t,+b.dataset.s,b.dataset.j==='1');break;
  case 'scope':scope=+v;if(scope===2&&pend[0]!==pend[1])pend=[pend[0]||pend[1],pend[0]||pend[1]];paintSheet();break;
  case 'choose':pick(v);break;
  case 'plus':document.getElementById('plusbox').innerHTML=isAdmin()?`<div class="free" style="margin:4px 0 8px"><input id="free" type="text" placeholder="Nouveau site (ajouté à la liste)"><button type="button" class="btn" data-act="freeok">OK</button></div>`:`<p class="demo">Site absent de la liste ? Demande à Raphaël ou Pierre de l'ajouter.</p>`;{const f=document.getElementById('free');if(f)f.focus()}break;
  case 'also':{const d=+v;also.has(d)?also.delete(d):also.add(d);b.classList.toggle('on',also.has(d))}break;
  case 'pclr':if(+v===2)pend=['',''];else{pend[+v]='';scope=+v}paintSheet();break;
  case 'freeok':{const x=document.getElementById('free').value.trim();if(x){document.getElementById('free').value='';pick(x)}}break;
  case 'rsite':sel=v;sheet.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));break;
  case 'kbok':{const ta=document.getElementById('note');if(ta)ta.blur()}break;
  case 'tag':{const ta=document.getElementById('note');ta.value=(ta.value.trim()?ta.value.trim()+' – ':'')+v;ta.focus()}break;
  case 'save':saveDay(document.getElementById('note').value.trim());break;
  case 'clear':pend=['',''];saveDay('');break;
  case 'close':closeSheet();break;
  case 'zoom':{const Z=[.6,.7,.8,.9,1,1.1,1.2];let i=Z.indexOf(zoomLv());i=Math.max(0,Math.min(Z.length-1,(i<0?4:i)+(+v)));try{localStorage.setItem(STORE+'-zoom',Z[i])}catch(x){}applyZoom();toast('Affichage '+Math.round(Z[i]*100)+' %');break}
  case 'ast':astSheet();break;
  case 'cp':absSheet();break;
  case 'reqnew':reqSheet();break;
  case 'req':assignSheet(+b.dataset.id);break;
  case 'reqday':reqDaySheet(+v);break;
  case 'cover':coverSheet(b.dataset.site,+b.dataset.s);break;
  case 'ack':{const st=b.dataset.site,sl=+b.dataset.s,k=key(S.off),n=(document.getElementById('ackn')||{}).value||'';DB.ack=DB.ack||{};DB.ack[k+'|'+st+'|'+sl]={by:S.user.n,at:Date.now(),note:n.trim()};
    DB.hist.unshift({at:Date.now(),who:S.user.n,t:'',wk:k,s:sl,from:st+' : personne',to:'Validé sans personne',note:n.trim()||null,kind2:'ack'});save();closeSheet();render();toast('Validé : '+st+' sans personne '+slotTxt(k,sl))}break;
  case 'unack':{const st=b.dataset.site,sl=+b.dataset.s,k=key(S.off);delete DB.ack[k+'|'+st+'|'+sl];save();coverSheet(st,sl);render();toast('Validation annulée')}break;
  case 'seen':DB.alerts.forEach(x=>x.seen=true);save();render();break;
  case 'assign':{const r=DB.reqs.find(x=>x.id===+b.dataset.id),t=b.dataset.t,w=week(r.wk);
    r.slots.forEach(sl=>{const old=w[t][sl];w[t][sl]=r.site;setNote(r.wk,t,sl,'');DB.hist.unshift({at:Date.now(),who:S.user.n,t,wk:r.wk,s:sl,from:old,to:r.site,note:null})});
    r.status='done';r.who=t;save();closeSheet();render();toast(t+' envoyé en renfort · '+short(r.by)+' est prévenu')}break;
  case 'refuse':{const r=DB.reqs.find(x=>x.id===+b.dataset.id);r.status='refused';save();closeSheet();render();toast('Demande refusée · '+short(r.by)+' est prévenu')}break;
  case 'send':{const t=b.dataset.t,st=b.dataset.site,sl=+b.dataset.s,k=key(S.off),w=week(S.off),old=w[t][sl];w[t][sl]=st;DB.hist.unshift({at:Date.now(),who:S.user.n,t,wk:k,s:sl,from:old,to:st,note:null});save();closeSheet();render();toast(t+' envoyé sur '+st)}break;
  case 'copy':{const t=S.user.n,k=key(S.off),w=week(S.off),p=week(S.off-1);let n=0;
    w[t].forEach((x,s)=>{if(!x&&p[t][s]&&!ferie(k,s>>1)){w[t][s]=p[t][s];setNote(k,t,s,noteOf(key(S.off-1),t,s));n++;DB.hist.unshift({at:Date.now(),who:t,t,wk:k,s,from:'',to:p[t][s],note:null})}});
    save();render();toast(n?`${n} case${n>1?'s':''} recopiée${n>1?'s':''}`:'Rien à recopier')}break;
  case 'xlsx':downloadXlsx();break;
  case 'export':exportSheet('Résumé des heures',exportText());break;
  case 'exportall':exportSheet('Extraction complète',exportAll());break;
  case 'xcopy':copyOrShow(XTXT,'xbox','Copié ! Colle-le maintenant dans Excel');break;
  case 'fclr':S.ft='';S.fs='';render();break;
  case 'tadd':techSheet(null);break;
  case 'tup':case 'tdn':{const i=+b.dataset.i,j=a==='tup'?i-1:i+1;[CONF.techs[i],CONF.techs[j]]=[CONF.techs[j],CONF.techs[i]];save();render()}break;
  case 'tedit':techSheet(+b.dataset.i);break;
  case 'tconf':S.confirm='t'+b.dataset.i;render();break;
  case 'tdel':CONF.techs.splice(+b.dataset.i,1);S.confirm=null;save();render();toast('Retiré (son historique est conservé)');break;
  case 'sconf':S.confirm='s'+v;render();break;
  case 'sdel':CONF.sites=CONF.sites.filter(s=>s.n!==v);CONF.req=CONF.req.filter(r=>r.site!==v);S.confirm=null;save();render();toast('Site retiré');break;
  case 'radd':reqSiteSheet();break;
  case 'axconf':S.confirm='x'+b.dataset.i;render();break;
  case 'axdel':CONF.astx=AX().slice();CONF.astx.splice(+b.dataset.i,1);S.confirm=null;save();render();toast('Retiré');break;
  case 'rconf':S.confirm='r'+b.dataset.i;render();break;
  case 'rdel':CONF.req.splice(+b.dataset.i,1);S.confirm=null;save();render();toast('Retiré');break;
  case 'bk':prune();copyOrShow(JSON.stringify({CONF,DB}),'bkbox','Sauvegarde copiée : colle-la dans une note');break;
  case 'rs':document.getElementById('bkbox').innerHTML='<label for="rsx">Colle la sauvegarde ici</label><textarea id="rsx" rows="5"></textarea><button class="btn" data-act="rsgo" style="margin-top:8px">Restaurer</button>';break;
  case 'rsgo':try{const j=JSON.parse(document.getElementById('rsx').value);if(!j.CONF||!j.DB)throw 0;CONF=j.CONF;DB=Object.assign(blankDB(),j.DB);save();render();toast('Sauvegarde restaurée')}catch(x){toast("Ce texte n'est pas une sauvegarde valide")}break;
  case 'wconf':S.confirm='wipe';render();break;
  case 'wipe':DB=blankDB();CONF=JSON.parse(JSON.stringify(DEFAULT_CONF));S.confirm=null;save();render();toast('Tout est effacé');break;
  }
});
document.addEventListener('click',e=>{const x=e.target;if(x&&x.type==='date'){try{x.showPicker()}catch(er){}}});
document.addEventListener('keydown',e=>{const x=e.target;if(e.key==='Enter'&&x.dataset&&(x.dataset.ch==='fti'||x.dataset.ch==='fsi')){e.preventDefault();x.blur()}});
document.addEventListener('input',e=>{const x=e.target;if(!x.dataset||(x.dataset.ch!=='fti'&&x.dataset.ch!=='fsi'))return;
  const opts=x.dataset.ch==='fti'?WORK().map(t=>[t,t]):fsOpts(),q=x.value.trim().toLowerCase(),ex=q?opts.find(o=>o[0].toLowerCase()===q):['',''];
  if(ex){if(x.dataset.ch==='fti')S.ft=ex[1];else S.fs=ex[1];render()}});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset&&x.dataset.ch==='hp'){S.hp=x.value;render()}else if(x.dataset&&x.dataset.ch==='fti'){const r=pickFrom(x.value,WORK().map(t=>[t,t]).concat(WORK().map(t=>[short(t),t])));if(r===null){toast('Plusieurs ou aucun technicien : choisis dans la liste');return}S.ft=r;render()}else if(x.dataset&&x.dataset.ch==='fsi'){const r=pickFrom(x.value,fsOpts());if(r===null){toast('Plusieurs ou aucun site : choisis dans la liste');return}S.fs=r;render()}});
async function boot(){
  render();
  if(sb){try{const {data,error}=await sb.from('team').select('email,name,role,ord').order('ord');if(error)throw error;TEAM=data||[]}catch(e){console.error(e)}
    try{const {data}=await sb.auth.getSession();const em=data&&data.session&&data.session.user&&String(data.session.user.email||'').toLowerCase();const u=em&&TEAM.find(x=>x.email===em);if(u)S.user={n:u.name,r:u.role}}catch(e){console.error(e)}}
  BOOTED=true;render();
  if(S.user){await pull();render()}
}
const autoPull=async()=>{if(document.visibilityState!=='visible'||!S.user||!LOADED||sheetOpen()||typing())return;if(await pull())render()};
document.addEventListener('visibilitychange',autoPull);setInterval(autoPull,30000);
boot();
}
